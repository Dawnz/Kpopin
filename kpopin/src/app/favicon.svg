<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4D8D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B5DE5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" ry="8" fill="url(#grad)" />

  <!-- Music2 icon (lucide-style) centered -->
  <!-- Musical note: stem + flag + circle -->
  <g stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Stem -->
    <line x1="19" y1="8" x2="19" y2="20" />
    <!-- Flag/beam -->
    <path d="M19 8 C22 9, 23 11, 22 13 C21 14, 19 14, 19 13" fill="white" stroke="none"/>
    <path d="M19 8 C22 9, 23 11, 22 13 C21 14, 19 14, 19 13" />
    <!-- Note head -->
    <ellipse cx="17" cy="20.5" rx="3" ry="2" transform="rotate(-15 17 20.5)" fill="white" stroke="none"/>
  </g>
</svg>