version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kpopin_db
    restart: always
    environment:
      POSTGRES_USER: kpopin
      POSTGRES_PASSWORD: kpopin_secret
      POSTGRES_DB: kpopin
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"
    volumes:
      - kpopin_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kpopin_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - kpopin_redis:/data

volumes:
  kpopin_data:
  kpopin_redis:
